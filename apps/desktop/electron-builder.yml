appId: app.scdelta.desktop
productName: scDelta
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
beforePack: scripts/require-xray.cjs
extraResources:
  - from: resources/xray
    to: xray
    filter: ['xray*', 'LICENSE']
protocols:
  - name: Web page
    schemes: [http, https]
linux:
  target: [AppImage, deb]
  maintainer: sc-simpledev <sc-simpledev@users.noreply.github.com>
  category: Network;WebBrowser
  executableName: scdelta
  mimeTypes: [text/html, x-scheme-handler/http, x-scheme-handler/https]
  desktop:
    entry:
      StartupWMClass: scDelta
deb:
  packageName: scdelta
  artifactName: scdelta_${version}_${arch}.${ext}
win:
  target: [nsis]
  executableName: scDelta
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish: null
