appId: app.scterra.desktop
productName: scTerra
copyright: Copyright © 2026 sc-simpledev. All Rights Reserved.
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
beforePack: scripts/require-xray.cjs
extraResources:
  - from: resources/xray
    to: xray
    filter: ['xray*', 'LICENSE']
protocols:
  - name: Web page
    schemes: [http, https]
linux:
  target: [AppImage, deb]
  maintainer: sc-simpledev <sc-simpledev@users.noreply.github.com>
  category: Network;WebBrowser
  executableName: scterra
  mimeTypes: [text/html, x-scheme-handler/http, x-scheme-handler/https]
  desktop:
    entry:
      StartupWMClass: scTerra
deb:
  packageName: scterra
  artifactName: scterra_${version}_${arch}.${ext}
win:
  target: [nsis]
  icon: build/icon.ico
  executableName: scTerra
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  # The zip is what updates are checked against, and one is built on each kind of Mac.
  target: [dmg, zip]
  category: public.app-category.productivity
  artifactName: scTerra-${version}-${arch}-mac.${ext}
  # No certificate yet: Apple silicon still needs this ad-hoc signature to start at all.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSCameraUsageDescription: Websites you allow can use your camera.
    NSMicrophoneUsageDescription: Websites you allow can use your microphone.
# Only installers go here. The source stays in the private repo.
publish:
  provider: github
  owner: sc-simpledev
  repo: scTerra
  # A release stays a draft until every platform has finished, so nobody gets half of one.
  releaseType: draft
