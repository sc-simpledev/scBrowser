appId: app.scbrowser.desktop
productName: scBrowser
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
protocols:
  - name: Web page
    schemes: [http, https]
linux:
  target: [AppImage, deb]
  maintainer: sc-simpledev <sc-simpledev@users.noreply.github.com>
  category: Network;WebBrowser
  executableName: scbrowser
  mimeTypes: [text/html, x-scheme-handler/http, x-scheme-handler/https]
  desktop:
    entry:
      StartupWMClass: scBrowser
deb:
  packageName: scbrowser
  artifactName: scbrowser_${version}_${arch}.${ext}
win:
  target: [nsis]
  executableName: scBrowser
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish: null
