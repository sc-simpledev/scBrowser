appId: app.scterra.desktop
productName: scTerra
copyright: Copyright © 2026 sc-simpledev. All Rights Reserved.
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
beforePack: scripts/require-xray.cjs
# The Linux launcher, and Widevine's VMP signatures for Windows and macOS (scripts/after-pack.cjs, vmp-sign.cjs).
afterPack: scripts/after-pack.cjs
afterSign: scripts/after-sign.cjs
# castLabs' Electron for Content Security, which plays protected video and music with Widevine.
# Each platform's build downloads castLabs' own Electron for that platform.
electronDownload:
  mirror: https://github.com/castlabs/electron-releases/releases/download/
# The same release as package.json's electron, which electron-builder can't read from a Git address.
electronVersion: 45.2.1+wvcus
extraResources:
  - from: resources/xray
    to: xray
    filter: ['xray*', 'LICENSE', 'wintun.dll', 'wintun-LICENSE.txt']
protocols:
  - name: Web page
    schemes: [http, https]
linux:
  target: [AppImage, deb]
  maintainer: sc-simpledev <sc-simpledev@users.noreply.github.com>
  category: Network;WebBrowser
  executableName: scterra
  # One file per size: the hicolor theme has no 1024x1024 folder, so icon.png alone left
  # menus and pinned taskbar launchers with a blank icon.
  icon: build/icons
  mimeTypes: [text/html, x-scheme-handler/http, x-scheme-handler/https]
  desktop:
    entry:
      StartupWMClass: scTerra
deb:
  packageName: scterra
  # Covers scterra-bin as well as the launcher: see scripts/after-pack.cjs.
  appArmorProfile: build/apparmor-profile.tpl
  artifactName: scterra_${version}_${arch}.${ext}
win:
  target: [nsis]
  icon: build/icon.ico
  executableName: scTerra
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  # The zip is what updates are checked against, and one is built on each kind of Mac.
  target: [dmg, zip]
  category: public.app-category.productivity
  artifactName: scTerra-${version}-${arch}-mac.${ext}
  # No certificate yet: Apple silicon still needs this ad-hoc signature to start at all.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSCameraUsageDescription: Websites you allow can use your camera.
    NSMicrophoneUsageDescription: Websites you allow can use your microphone.
# Only installers go here. The source stays in the private repo.
publish:
  provider: github
  owner: sc-simpledev
  repo: scTerra
  # A release stays a draft until every platform has finished, so nobody gets half of one.
  releaseType: draft
