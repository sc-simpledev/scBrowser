name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check main.ts
      - run: deno test --allow-env
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a pnpm exec playwright test
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright test
      - name: Build installers
        # A failing test shouldn't stop people getting a build to try.
        if: ${{ !cancelled() }}
        run: pnpm dist
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: scterra-${{ matrix.os }}
          path: |
            apps/desktop/release/**/*.AppImage
            apps/desktop/release/**/*.deb
            apps/desktop/release/**/*.exe
          if-no-files-found: ignore
