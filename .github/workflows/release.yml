name: Release

# Pushing a tag such as v0.2.0 builds every platform and publishes to the public scTerra repo,
# which holds installers only. Browsers find new versions there, with no token.
#
# Needs one secret: RELEASE_TOKEN, a fine-grained token limited to sc-simpledev/scTerra with
# Contents read and write. It must never go into the app. EVS_ACCOUNT_NAME and EVS_PASSWD (a free
# castLabs EVS account) give Windows and Mac builds the VMP signature streaming services want.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app's version
        run: test "v$(node -p "require('./apps/desktop/package.json').version")" = "$GITHUB_REF_NAME"
      # Made once, here: builds that each made their own split the files between two releases.
      - name: Create the draft release
        run: gh release create "$GITHUB_REF_NAME" --repo sc-simpledev/scTerra --draft --title "${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Widevine: Netflix, Spotify and the like only play in a Windows or Mac app with a production VMP
      # signature, which castLabs' free EVS service adds as the app is packaged (scripts/vmp-sign.cjs).
      # Needs two secrets, EVS_ACCOUNT_NAME and EVS_PASSWD; without them the build carries on with the
      # development signature and a warning. Linux has no VMP and needs nothing.
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - name: VMP signing tool
        if: runner.os != 'Linux'
        shell: bash
        run: python -m pip install --upgrade castlabs-evs
      - run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      # The packaged app must open a window and load a tab. If it can't, this fails, the draft is
      # never published, and nobody is offered a broken build. It runs on a throwaway profile.
      - name: Start the packaged app once
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd "apps/desktop/release/$version"
          case "$RUNNER_OS" in
            Linux) xvfb-run -a "./scTerra-$version.AppImage" --appimage-extract-and-run --no-sandbox --smoke-test ;;
            Windows) ./win-unpacked/scTerra.exe --smoke-test ;;
            macOS) "$(ls -d mac*/scTerra.app | head -1)/Contents/MacOS/scTerra" --smoke-test ;;
          esac
      # Terra Code's workflows installed on GitHub (comment and scheduled runs) download this.
      - name: Attach Terra Code's cloud runner
        if: runner.os == 'Linux'
        run: |
          cp apps/desktop/out/cloud/runner.mjs terra-code-runner.mjs
          gh release upload "$GITHUB_REF_NAME" terra-code-runner.mjs --repo sc-simpledev/scTerra --clobber
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # Each Mac overwrites the other's latest-mac.yml, so each keeps a copy under its own name.
      - name: Keep this Mac's update file
        if: runner.os == 'macOS'
        run: |
          cp "apps/desktop/release/${GITHUB_REF_NAME#v}/latest-mac.yml" "mac-update-$(uname -m).yml"
          gh release upload "$GITHUB_REF_NAME" "mac-update-$(uname -m).yml" --repo sc-simpledev/scTerra --clobber
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List both kinds of Mac in the update file
        run: |
          mkdir mac
          gh release download "$GITHUB_REF_NAME" --repo sc-simpledev/scTerra --dir mac --pattern 'mac-update-*.yml'
          node apps/desktop/scripts/merge-mac-update.mjs latest-mac.yml mac/mac-update-*.yml
          gh release upload "$GITHUB_REF_NAME" latest-mac.yml --repo sc-simpledev/scTerra --clobber
          for file in mac/mac-update-*.yml; do
            gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$file")" --repo sc-simpledev/scTerra --yes
          done
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Publish the finished draft
        run: gh release edit "$GITHUB_REF_NAME" --repo sc-simpledev/scTerra --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
