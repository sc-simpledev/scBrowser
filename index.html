<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scTerra — Browse the World</title>
<meta name="description" content="scTerra is a browser for Linux, Windows and macOS with AI built in.">
<meta name="theme-color" content="#05070a">
<meta property="og:title" content="scTerra — Browse the World">
<meta property="og:description" content="A browser for Linux, Windows and macOS, with AI built in.">
<link rel="preload" href="assets/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: Geist; src: url(assets/geist-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --ink: #eef2f2; --dim: #8b9698; --line: #ffffff24; --night: #05070a; --gutter: clamp(16px, 4.5vw, 64px); }
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

.bar { position: fixed; z-index: 5; inset: 0 0 auto; display: flex; justify-content: space-between; align-items: baseline; padding: 24px var(--gutter); font-size: 15px; mix-blend-mode: difference; }
.bar b { font-weight: 600; letter-spacing: -.02em; }
.bar a:last-child, .end a, #outro a { border-bottom: 1px solid currentColor; padding-bottom: 1px; }

.film { position: relative; height: 1000vh; height: 1000svh; }
.stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: linear-gradient(#05070a 62%, #0a2a31); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.layer { position: absolute; inset: 0; padding: 0 var(--gutter); display: flex; flex-direction: column; justify-content: center; padding-bottom: 22vh; will-change: opacity, transform; }
h1, h2 { margin: 0; font-weight: 500; letter-spacing: -.045em; line-height: 1.06; font-size: clamp(44px, 8.6vw, 136px); }

#hero p, #outro p { margin: 18px 0 0; max-width: 30em; font-size: clamp(17px, 1.6vw, 22px); line-height: 1.4; letter-spacing: -.01em; color: #c5cfd1; }
#hero .cue { position: absolute; left: var(--gutter); bottom: 44px; margin: 0; font-size: 14px; letter-spacing: 0; color: var(--dim); }
#outro { opacity: 0; visibility: hidden; }
#outro h2 { font-size: clamp(44px, 8.6vw, 136px); }
#outro span { margin-left: .6em; color: var(--dim); }
#explore { opacity: 0; visibility: hidden; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); gap: clamp(24px, 4vw, 64px); align-items: center; align-content: center; padding-bottom: 8vh; }
h2 { font-size: clamp(38px, 5.6vw, 88px); }
.notes { position: relative; display: block; margin-top: 18px; height: 9em; font-size: clamp(16px, 1.35vw, 19px); line-height: 1.4; letter-spacing: -.01em; color: #c5cfd1; }
.notes p { position: absolute; inset: 0 auto auto 0; margin: 0; max-width: 27em; }
.frame { position: relative; aspect-ratio: 1320 / 860; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #17191c; box-shadow: 0 40px 90px -40px #000; }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: opacity, transform; }
.reel { display: block; height: 1.06em; overflow: hidden; }
.reel-track { display: block; will-change: transform; }
.reel-track span { display: block; height: 1.06em; }
.index { position: absolute; right: var(--gutter); bottom: 44px; display: flex; gap: 22px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.index button { all: unset; cursor: pointer; color: var(--ink); opacity: .45; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.end { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; padding: 26px var(--gutter); border-top: 1px solid var(--line); color: var(--dim); font-size: 14px; }
.end nav { display: flex; gap: 24px; color: var(--ink); }

@media (max-width: 640px) {
  #explore { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 72px; padding-bottom: 96px; }
  .notes { height: 8.6em; margin-top: 10px; font-size: 15px; }
  .index { left: var(--gutter); right: auto; flex-wrap: wrap; gap: 8px 18px; bottom: 28px; }
  #hero .cue { bottom: 28px; }
  #outro span { display: block; margin: 6px 0 0; }
}
</style>
</head>
<body>
<header class="bar"><b>scTerra</b><a href="/downloads">Downloads</a></header>

<main>
  <div class="film" id="film">
    <div class="stage" id="stage">
      <canvas id="terra" aria-hidden="true"></canvas>
      <section class="layer" id="hero"><h1>scTerra</h1><p>A browser for Linux, Windows and macOS, with AI built in.</p><p class="cue" aria-hidden="true">Scroll ↓</p></section>
      <section class="layer" id="explore" aria-label="What scTerra does">
        <div>
          <h2><span aria-hidden="true">Browse the</span><span class="reel" aria-hidden="true"><span class="reel-track" id="reel"></span></span><span class="sr" id="said"></span></h2>
          <div class="notes" id="notes"></div>
        </div>
        <div class="frame" id="frame"></div>
      </section>
      <ul class="index" id="index" aria-label="Features"></ul>
      <section class="layer" id="outro"><h2>Browse the World.</h2><p><a href="/downloads">Download scTerra</a><span>for Linux, Windows and macOS</span></p></section>
    </div>
  </div>
</main>

<footer class="end">
  <span>© 2026 sc-simpledev. All Rights Reserved.</span>
  <nav aria-label="Links"><a href="/downloads">Downloads</a><a href="https://github.com/sc-simpledev/scTerra/releases" rel="noopener">Releases</a></nav>
</footer>

<script>
(function () {
  var SCENES = [
    ['World', 'world', 'Everyday browsing without the clutter. Trackers are blocked and cookie banners are rejected for you, while groups, workspaces, split view and sleeping tabs keep a long session tidy and light on memory.', 'An article open in scTerra, with tabs down the side.'],
    ['Sidebar', 'sidebar', 'Ask about the page you’re on without leaving it. The assistant summarises articles and videos, answers with citations that jump to the exact words, and can work through a page for you, with your approval at every step.', 'The assistant summarising a page in the sidebar.'],
    ['AI', 'ai', 'Research across up to eight tabs or the web, and turn it into a report with sources you can click. Reports come in several designs, and download as PDF, Word, HTML or Markdown.', 'A report written by the assistant, open beside the chat.'],
    ['Code', 'code', 'Terra Code works in a project folder you choose. It reads your files, makes edits and runs your tests, asks before commands and, unless you say otherwise, before changes, and can undo what it did.', 'Terra Code after fixing a bug, with its plan and changed files.'],
    ['VPN', 'vpn', 'Bring your own VLESS, VMess, Trojan, Shadowsocks or proxy connections, or subscribe to a list. Cover just the browser or the whole computer, and let scTerra pick the fastest server.', 'The VPN page with a list of connections.'],
    ['Vault', 'vault', 'Passwords, addresses and two-step codes, sealed with a master password or your system keychain. It fills in your saved logins, flags weak or reused passwords, and checks for leaks when you ask.', 'The password vault with saved logins.']
  ];
  var WORDS = SCENES.map(function (scene) { return scene[0]; });
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var film = $('film'), hero = $('hero'), explore = $('explore'), reel = $('reel'), said = $('said'), index = $('index'), outro = $('outro');

  // Where each part of the page sits along the one scroll.
  var HERO_OUT = [.012, .08], EXPLORE_IN = [.065, .125], REEL = [.125, .85], EXPLORE_OUT = [.875, .925], OUTRO_IN = [.915, .975];

  WORDS.forEach(function (word) {
    var line = document.createElement('span');
    line.textContent = word;
    reel.appendChild(line);
  });
  var lines = [].slice.call(reel.children);
  var notes = SCENES.map(function (scene) {
    var p = document.createElement('p');
    p.textContent = scene[2];
    $('notes').appendChild(p);
    return p;
  });
  var shots = SCENES.map(function (scene) {
    var img = new Image(1320, 860);
    img.src = 'assets/shots/' + scene[1] + '.webp';
    img.alt = scene[3];
    img.decoding = 'async';
    $('frame').appendChild(img);
    return img;
  });
  var marks = WORDS.map(function (word, i) {
    var li = document.createElement('li'), button = document.createElement('button');
    button.type = 'button';
    button.textContent = word;
    button.addEventListener('click', function () { scrollTo({ top: progressOf(i) * room(), behavior: still ? 'auto' : 'smooth' }); });
    li.appendChild(button);
    index.appendChild(li);
    return button;
  });

  var clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  var range = function (r, v) { var t = clamp((v - r[0]) / (r[1] - r[0])); return t * t * (3 - 2 * t); };
  var room = function () { return Math.max(1, film.offsetHeight - innerHeight); };
  function progressOf(i) { return REEL[0] + (REEL[1] - REEL[0]) * (i + .001) / (WORDS.length - 1); }

  /** Rests on each word, and moves between them without a hard start or stop. */
  function reelPosition(p) {
    var v = clamp((p - REEL[0]) / (REEL[1] - REEL[0])) * (WORDS.length - 1);
    var whole = Math.floor(v), t = v - whole;
    var moving = clamp((t - .22) / .56);
    return whole + moving * moving * moving * (moving * (6 * moving - 15) + 10);
  }

  var shown = -1, spoken = -1;
  function layout(p) {
    var out = range(HERO_OUT, p);
    hero.style.opacity = 1 - out;
    hero.style.transform = 'translate3d(0,' + (-36 * out) + 'px,0)';
    hero.style.visibility = out >= 1 ? 'hidden' : 'visible';

    var seen = range(EXPLORE_IN, p) * (1 - range(EXPLORE_OUT, p));
    explore.style.opacity = seen;
    explore.style.visibility = seen <= 0 ? 'hidden' : 'visible';
    index.style.opacity = seen;
    index.style.visibility = seen <= 0 ? 'hidden' : 'visible';

    var closing = range(OUTRO_IN, p);
    outro.style.opacity = closing;
    outro.style.transform = 'translate3d(0,' + (24 * (1 - closing)) + 'px,0)';
    outro.style.visibility = closing <= 0 ? 'hidden' : 'visible';

    var at = reelPosition(p);
    if (at !== shown) {
      shown = at;
      reel.style.transform = 'translate3d(0,' + (-at * 100 / WORDS.length) + '%,0)';
      lines.forEach(function (line, i) { line.style.opacity = 1 - .85 * clamp(Math.abs(i - at)); });
      marks.forEach(function (mark, i) { mark.style.opacity = .45 + .55 * (1 - clamp(Math.abs(i - at))); });
      notes.forEach(function (note, i) { note.style.opacity = clamp(1 - Math.abs(i - at) * 1.6); });
      shots.forEach(function (shot, i) {
        var away = i - at, off = Math.abs(away) >= 1;
        shot.style.visibility = off ? 'hidden' : 'visible';
        shot.style.opacity = clamp(1 - Math.abs(away));
        shot.style.transform = 'translate3d(0,' + (away * 18) + 'px,0)';
      });
      var near = Math.round(at);
      if (near !== spoken) {
        spoken = near;
        said.textContent = 'Browse the ' + WORDS[near];
        marks.forEach(function (mark, i) { if (i === near) mark.setAttribute('aria-current', 'true'); else mark.removeAttribute('aria-current'); });
      }
    }
  }

  var target = 0, current = 0;
  function read() { target = clamp(scrollY / room()); }
  addEventListener('scroll', read, { passive: true });
  addEventListener('resize', read);
  read();
  current = target;
  layout(current);

  // One loop drives the text and the planet, so they can't drift apart.
  var draw = setupPlanet();
  var last = performance.now(), started = last, visible = true, slow = 0;
  new IntersectionObserver(function (e) {
    var was = visible;
    visible = e[0].isIntersecting;
    if (visible && !was) { last = performance.now(); requestAnimationFrame(frame); }
  }).observe($('stage'));

  // The opening: light first, then the name, the line under it, and the cue to scroll.
  var canvas = $('terra'), arrived = false;
  var entrances = [].map.call(hero.children, function (el, i) { return [el, [.9 + i * .45, 2.6 + i * .45]]; });
  function arrive(t) {
    canvas.style.opacity = range([.1, 2.6], t);
    entrances.forEach(function (entry) {
      var text = range(entry[1], t);
      entry[0].style.opacity = text;
      entry[0].style.transform = 'translate3d(0,' + (14 * (1 - text)) + 'px,0)';
    });
    if (t > 3.5) {
      arrived = true;
      canvas.style.opacity = '';
      entrances.forEach(function (entry) { entry[0].style.opacity = entry[0].style.transform = ''; });
    }
  }

  function frame(now) {
    var dt = Math.min(.25, (now - last) / 1000);
    last = now;
    // Frame-rate independent easing towards where the page has been scrolled to.
    current = still ? target : current + (target - current) * (1 - Math.exp(-dt * 4.5));
    if (Math.abs(target - current) < .00002) current = target;
    layout(current);
    if (!still && !arrived) arrive((now - started) / 1000);
    if (draw) {
      draw(current, still ? 20 : (now - started) / 1000 + 20, still ? 1 : clamp((now - started) / 3200));
      if (dt > .026) { if (++slow > 40) { draw.lower(); slow = 0; } } else if (slow > 0) slow--;
    }
    if (visible) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function setupPlanet() {
    var canvas = $('terra');
    var gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
    if (!gl) return null;
    var fs = [
      'precision highp float;uniform vec2 R;uniform float T,S,I;',
      'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
      'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}',
      'float fbm(vec2 p){float a=.5,v=0.;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.03+vec2(17.3,9.1);a*=.5;}return v;}',
      'void main(){',
      ' vec2 u=(gl_FragCoord.xy-.5*R)/R.y;',
      ' vec3 air=vec3(.25,.66,.74),sun=vec3(1.,.93,.84);',
      ' float e=I*I*(3.-2.*I);',
      ' float r=2.4,top=mix(-.62,-.33,e)+.1*sin(S*3.14159);',
      ' vec2 c=vec2(.34*S-.1,top-r),d=u-c;float l=length(d),o=l-r;',
      ' vec2 g=floor(gl_FragCoord.xy/1.5);',
      ' vec3 col=vec3(step(.9978,h(g))*h(g+3.))*(.5+.5*sin(T*.5+h(g)*40.))*smoothstep(-.05,.3,o);',
      ' float x=(d.x-.25*S)*(d.x-.25*S);',
      ' if(o>0.){',
      '  col+=air*(exp(-o*11.)*.55+exp(-o*3.2)*.11)*exp(-x*1.6)*e;',
      '  col+=sun*exp(-o*60.)*exp(-x*7.)*.9*e;',
      ' }else{',
      '  float z=sqrt(max(0.,r*r-dot(d,d)))/r;vec3 N=vec3(d/r,z);',
      '  vec2 m=vec2(atan(N.x,N.z)+T*.006+S*2.4,asin(N.y))*4.2;',
      '  float land=smoothstep(.5,.58,fbm(m+fbm(m*1.4)*.3));',
      '  float cloud=smoothstep(.58,.84,fbm(m*1.7+vec2(T*.012,0.)));',
      '  float lit=max(0.,dot(N,normalize(vec3(.1*S,.95,.2))));',
      '  vec3 ground=mix(vec3(.01,.035,.055),vec3(.035,.1,.085),land);',
      '  col=(ground*(.2+lit*1.05)+vec3(.62,.72,.76)*cloud*lit*.3)*e;',
      '  col+=air*pow(1.-z,3.6)*(.35+lit)*.75*e;',
      ' }',
      ' col*=1.-.3*dot(u,u);',
      ' col=pow(col/(1.+col*.22),vec3(.88));',
      ' col+=(h(gl_FragCoord.xy+fract(T))-.5)*.012;',
      ' gl_FragColor=vec4(col,1.);}'
    ].join('\n');
    function shader(type, src) { var o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; }
    var prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(prog, 0, 'p');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    var uR = gl.getUniformLocation(prog, 'R'), uT = gl.getUniformLocation(prog, 'T'), uS = gl.getUniformLocation(prog, 'S'), uI = gl.getUniformLocation(prog, 'I');
    var scale = Math.min(devicePixelRatio || 1, 1.25);
    function size() {
      canvas.width = Math.max(1, Math.round(canvas.clientWidth * scale));
      canvas.height = Math.max(1, Math.round(canvas.clientHeight * scale));
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    addEventListener('resize', size);
    size();
    var render = function (s, t, i) {
      gl.uniform2f(uR, canvas.width, canvas.height);
      gl.uniform1f(uT, t); gl.uniform1f(uS, s); gl.uniform1f(uI, i);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    // A slow graphics chip gets fewer pixels rather than a stuttering page.
    render.lower = function () { if (scale > .55) { scale *= .8; size(); } };
    return render;
  }
})();
</script>
</body>
</html>
